<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			const theme = localStorage.getItem('theme');
			const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
				? 'dark'
				: 'light';
			document.documentElement.dataset.theme = theme || preferredTheme;
			document.documentElement.style.colorScheme = theme || preferredTheme;
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Michael Olawale",
				"url": "https://mykel.codes",
				"email": "hello@mykel.codes",
				"jobTitle": "Lead React Native Engineer, VP; founder-minded product technologist",
				"description": "Michael Olawale is a London-based React Native and frontend engineering leader with 10+ years of experience shipping mobile and web products across Africa, North America, and Europe.",
				"sameAs": [
					"https://github.com/mykelcodes",
					"https://www.linkedin.com/in/michaelolawale/",
					"https://x.com/mykel_io"
				]
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
